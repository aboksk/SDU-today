services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdu
      POSTGRES_PASSWORD: sdu_local
      POSTGRES_DB: sdu_today
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdu -d sdu_today"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
